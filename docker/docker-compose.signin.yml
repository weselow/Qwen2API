# Standalone alternative to docker-compose.dev.yml with the v2 session
# pipeline (epic Qwen2API-jik): Qwen2API + signin-worker sidecar.
# Coolify: Base Directory /, Compose Location /docker/docker-compose.signin.yml.
# CLI: docker compose --project-directory . --env-file <private.env> -f docker/docker-compose.signin.yml up -d --build
services:
  qwen2api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    ports:
      - "${QWEN_PORT_BINDING:-3000:3000}"
    volumes:
      - ${QWEN_DATA_DIR:-./data}:/app/data
      - ${QWEN_LOGS_DIR:-./logs}:/app/logs
      - ${QWEN_CACHES_DIR:-./caches}:/app/caches
    environment:
      - SERVICE_PORT=3000
      - API_KEY=${API_KEY:?Set the existing API key or a new private key}
      - LISTEN_ADDRESS=${LISTEN_ADDRESS:-}
      - SEARCH_INFO_MODE=${SEARCH_INFO_MODE:-table}
      - OUTPUT_THINK=${OUTPUT_THINK:-true}
      - SIMPLE_MODEL_MAP=${SIMPLE_MODEL_MAP:-false}
      - REDIS_URL=${REDIS_URL:-}
      - DATA_SAVE_MODE=${DATA_SAVE_MODE:-file}
      - ACCOUNTS=${ACCOUNTS:-}
      - CACHE_MODE=${CACHE_MODE:-file}
      # v2 session pipeline: browser sessions come from the sidecar.
      - V2_SESSION_MODE=${V2_SESSION_MODE:-browser}
      # completions: auto = curl-impersonate, else axios; browser = streamed
      # from the worker's resident page (Qwen2API-3ue.3), switched on explicitly.
      - COMPLETIONS_TRANSPORT=${COMPLETIONS_TRANSPORT:-auto}
      # chats/new through the worker's resident page (docs/browser-egress-
      # design.md). Ships OFF: browser egress is switched on explicitly
      # (CHAT_CREATION_TRANSPORT=browser) and rolled back the same way.
      # Session recovery throttles; 0 disables either.
      - CHAT_CREATION_TRANSPORT=${CHAT_CREATION_TRANSPORT:-direct}
      - V2_SESSION_RECOVERY_MIN_INTERVAL_MS=${V2_SESSION_RECOVERY_MIN_INTERVAL_MS:-30000}
      - V2_SESSION_RELOGIN_MIN_INTERVAL_MS=${V2_SESSION_RELOGIN_MIN_INTERVAL_MS:-60000}
      - SIGNIN_WORKER_URL=http://signin-worker:3100
      - SIGNIN_WORKER_TOKEN=${SIGNIN_WORKER_TOKEN:-}
      # Must be at least the worker's SIGNIN_LOGIN_MAX_WAIT_MS + SIGNIN_TIMEOUT_MS, and at least a renewal's
      # worst wait: RESIDENT_STREAM_WAIT_MS + RESIDENT_LOAD_MAX_WAIT_MS + 2 x RESIDENT_LOAD_MIN_INTERVAL_MS
      # + 25000 (the calls in flight, the token settling after the reload) + the reload itself: about 200000 by default.
      - SIGNIN_WORKER_TIMEOUT_MS=${SIGNIN_WORKER_TIMEOUT_MS:-240000}
    depends_on:
      signin-worker:
        condition: service_healthy

  signin-worker:
    build:
      context: ./signin-worker
    restart: always
    environment:
      - SIGNIN_WORKER_TOKEN=${SIGNIN_WORKER_TOKEN:-}
      - SIGNIN_HEADLESS=${SIGNIN_HEADLESS:-true}
      # Which headless browser: the shell, as before, or the full Chromium
      # presenting as one with a window (docs/browser-egress-design.md,
      # "HeadlessChrome"). The latter takes about twice the memory.
      - SIGNIN_HEADLESS_MODE=${SIGNIN_HEADLESS_MODE:-shell}
      # Resident pages for browser egress (docs/browser-egress-design.md).
      # ~200-300 MB of Chromium each: keep the cap above the number of
      # accounts that generate at the same time.
      - MAX_RESIDENT_PAGES=${MAX_RESIDENT_PAGES:-16}
      - RESIDENT_KEEPALIVE_MS=${RESIDENT_KEEPALIVE_MS:-300000}
      - SIGNIN_EGRESS_MAX_TIMEOUT_MS=${SIGNIN_EGRESS_MAX_TIMEOUT_MS:-600000}
      # 0 = no cap: a streamed answer is relayed, not buffered.
      - SIGNIN_EGRESS_MAX_STREAM_BYTES=${SIGNIN_EGRESS_MAX_STREAM_BYTES:-0}
      # Full logins go one at a time, this far apart (+ up to the same again
      # as jitter): batched sign-ins from one IP feed the Baxia score.
      - SIGNIN_LOGIN_MIN_INTERVAL_MS=${SIGNIN_LOGIN_MIN_INTERVAL_MS:-30000}
      - SIGNIN_LOGIN_MAX_WAIT_MS=${SIGNIN_LOGIN_MAX_WAIT_MS:-120000}
      # Since 2026-11-26 (Qwen2API-xun, Qwen2API-nch, Qwen2API-ops), for many accounts.
      # A page's token is renewed in place before a call that finds it nearly spent, instead
      # of the page being reloaded for the refused call; false = off, and a refusal is the
      # app's recovery's alone. The refreshes of every page start at least this far apart; 1 = not kept apart.
      - SIGNIN_PAGE_TOKEN_REFRESH=${SIGNIN_PAGE_TOKEN_REFRESH:-true}
      - SIGNIN_TOKEN_REFRESH_MIN_INTERVAL_MS=${SIGNIN_TOKEN_REFRESH_MIN_INTERVAL_MS:-2000}
      # A navigation on a live page (a renewal, a sign-in) waits this long for the streams
      # running on it, which a reload cuts; 0 = it does not wait.
      - RESIDENT_STREAM_WAIT_MS=${RESIDENT_STREAM_WAIT_MS:-20000}
      # Every page load of every account (a lazy open, a renewal) starts this far from the
      # previous one, plus up to the same again as jitter; 1 = no queue. A sign-in is not in
      # that queue: the login pacer spaces sign-ins.
      - RESIDENT_LOAD_MIN_INTERVAL_MS=${RESIDENT_LOAD_MIN_INTERVAL_MS:-10000}
      # No page load waits longer than this for its turn; a longer queue is packed closer. One
      # exception: a sign-in that begins just before a load's turn holds it back by up to one interval
      # more — one interval in all, however many begin. 0 = no limit.
      - RESIDENT_LOAD_MAX_WAIT_MS=${RESIDENT_LOAD_MAX_WAIT_MS:-120000}
      # Removing an account in the app tells the worker (POST /forget), which
      # drops its session and closes its page. Set to true, the browser
      # profile goes too — not at once, but after the pause below: an account
      # added again inside it keeps its profile and skips the sign-in
      # (Qwen2API-t8s); one added again after it signs in afresh.
      - SIGNIN_FORGET_DELETES_PROFILE=${SIGNIN_FORGET_DELETES_PROFILE:-false}
      # The pause before a removed account's profile is deleted, in ms.
      # 0 = at once.
      - SIGNIN_FORGET_GRACE_MS=${SIGNIN_FORGET_GRACE_MS:-120000}
    # One Chromium profile per account; keep them on a volume so auth.qwen.ai
    # sessions survive restarts and renewal stays a silent reload.
    volumes:
      - ${SIGNIN_PROFILES_DIR:-signin_profiles}:/app/profiles
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    # No published ports: the API carries credentials and bearer tokens and
    # must stay on the internal compose network.

volumes:
  signin_profiles: {}
