name: Verify and build

on:
  workflow_call:
    inputs:
      filter-builds:
        description: 'Limit builds to changes that affect build inputs'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      binaries: ${{ steps.plan.outputs.binaries }}
    steps:
      - uses: actions/checkout@v5
        if: inputs.filter-builds
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes that need builds
        id: plan
        shell: node {0}
        env:
          FILTER_BUILDS: ${{ inputs.filter-builds }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          const { execFileSync } = require('node:child_process')
          const { appendFileSync } = require('node:fs')
          const { FILTER_BUILDS, GITHUB_EVENT_NAME, BASE_SHA, HEAD_SHA, GITHUB_OUTPUT } = process.env

          let binaries = true
          if (FILTER_BUILDS === 'true' && ['pull_request', 'push'].includes(GITHUB_EVENT_NAME) && BASE_SHA && HEAD_SHA) {
            const range = GITHUB_EVENT_NAME === 'pull_request' ? [`${BASE_SHA}...${HEAD_SHA}`] : [BASE_SHA, HEAD_SHA]
            try {
              // Include both paths when a build input is moved out of a build directory.
              const output = execFileSync('git', ['diff', '--name-only', '-z', '--no-renames', ...range, '--'], { encoding: 'utf8' })
              const paths = output.split('\0').filter(Boolean)
              const buildPath = /^(?:(?:src|signin-worker|public|docker|tools|\.github\/workflows)\/|(?:package\.json|bun\.lock|\.dockerignore)$)/
              binaries = paths.length === 0 || paths.some(file => buildPath.test(file))
            } catch {
              console.warn('Unable to list changed paths. Running all builds.')
            }
          }
          appendFileSync(GITHUB_OUTPUT, `binaries=${binaries}\n`)

  regression:
    runs-on: ubuntu-24.04
    # The gate may consume 2 x 300s; leave time for installation and lint.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # package.json names bun in packageManager, and v5 caches on its own from that
          # field: off, so that the step does what it did on v4.
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
        env:
          API_KEY: ci-test-key
          DATA_SAVE_MODE: none
          ACCOUNTS: ''
          ENABLE_CLI: 'false'
          ENABLE_FILE_LOG: 'false'
          CACHE_MODE: default
          SEARCH_INFO_MODE: text
          TEST_GATE_TIMEOUT_MS: 300000
          TEST_GATE_ATTEMPTS: 2

  worker-node20:
    name: Sign-in worker on its production Node (20)
    # The worker of prod is built FROM node:20-slim, while everything else here
    # runs on Node 24: its own test files once on the Node it runs on in
    # production (Qwen2API-25q). The gate script does not run on Node 20
    # (--test-isolation needs Node 22) — one process per file instead, over the
    # list tools/gate-image/run-worker-tests.js names, which sets the gate's
    # environment itself. No count is compared: the number of tests these files
    # generate varies with the Node version. A file gets WORKER_TESTS_TIMEOUT_MS,
    # and the job is given room for every file to run to the end of it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-node20-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Build the Node 20 image from the recipe in the repository
        run: docker build -t qwen2api-gate-node20 -f tools/gate-image/Dockerfile.node20 tools/gate-image
      - name: The Node the worker's tests are about to run on
        run: docker run --rm qwen2api-gate-node20 node --version
      - name: The worker's test files, one process per file, on Node 20
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work -e WORKER_TESTS_TIMEOUT_MS=150000 \
            qwen2api-gate-node20 node tools/gate-image/run-worker-tests.js

  frontend:
    needs: changes
    if: needs.changes.outputs.binaries == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-frontend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('public/bun.lock') }}
      - run: bun install --cwd public --frozen-lockfile
      - run: bun run build:frontend
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: public/dist/
          if-no-files-found: error
          retention-days: 7

  binaries:
    # The worker's tests on the Node of prod come first too: nothing is built
    # around a worker that failed there.
    needs: [regression, frontend, worker-node20]
    name: Binary and container (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            docker_arch: amd64
            extension: ''
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            docker_arch: arm64
            extension: ''
          - platform: windows-x64
            runner: windows-2022
            docker_arch: ''
            extension: .exe
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: public/dist
      # No backend devDependencies or Node-based fallback in these jobs.
      - run: bun install --frozen-lockfile --production
      - name: Verify source runtime
        run: bun run test:bun
      - name: Compile native executable
        run: bun --no-env-file tools/build-binary.mjs --target bun-${{ matrix.platform }}
      - name: Verify isolated native executable
        run: bun run test:bun --binary pkg_dist/qwen2api-${{ matrix.platform }}${{ matrix.extension }}
      - name: Package executable and checksum
        run: bun --no-env-file tools/package-binary.mjs --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.platform }}
          path: pkg_dist/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Compile Debian (glibc) executable
        if: runner.os == 'Linux'
        run: bun --no-env-file tools/build-binary.mjs --target bun-${{ matrix.platform }} --outfile pkg_dist/docker/${{ matrix.docker_arch }}/qwen2api
      - uses: docker/setup-buildx-action@v4
        if: runner.os == 'Linux'
      - name: Build container from the compiled executable
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: BINARY_SOURCE=prebuilt
          platforms: linux/${{ matrix.docker_arch }}
          tags: qwen2api:ci-${{ matrix.docker_arch }}
          load: true
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=binary-image-${{ matrix.docker_arch }}
          cache-to: type=gha,mode=max,scope=binary-image-${{ matrix.docker_arch }}
      - name: Verify actual Debian container
        if: runner.os == 'Linux'
        run: bun run test:bun --docker-image qwen2api:ci-${{ matrix.docker_arch }}
      - name: Export the tested image without rebuilding it
        if: runner.os == 'Linux'
        run: docker save --output pkg_dist/docker-image-${{ matrix.docker_arch }}.tar qwen2api:ci-${{ matrix.docker_arch }}
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: docker-image-${{ matrix.docker_arch }}
          path: pkg_dist/docker-image-${{ matrix.docker_arch }}.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
